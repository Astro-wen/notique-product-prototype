<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <title>后端数据流</title>
  <desc>决定请求经过版本与幂等检查，在 D1 原子事务内保存新版本、决定记录、依赖失效、outbox 和回执，再返回统一快照，其中要点直接从账本读取。事务 outbox 触发后台概要，只有输入版本仍有效时发布当前正文；否则保留历史并等待最新任务。</desc>
  <rect x="0" y="0" width="1000" height="460" fill="#FFFFFF"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#111111">
    <text x="30" y="32" font-size="22">后端数据流</text>
  </g>
  <g fill="none" stroke="#111111" stroke-width="1.8" stroke-linejoin="round">
    <polyline points="154,148 193,148"/>
    <polyline points="363,148 405,148"/>
    <polyline points="657,148 703,148"/>
    <polyline points="500,243 500,280 335,280 335,319"/>
    <polyline points="420,355 473,355"/>
    <polyline points="570,300 570,278 855,278 855,297"/>
    <polyline points="665,355 707,355 707,419 738,419"/>
  </g>
  <g fill="#111111">
    <polygon points="195,148 186,143 186,153"/>
    <polygon points="407,148 398,143 398,153"/>
    <polygon points="705,148 696,143 696,153"/>
    <polygon points="335,321 330,312 340,312"/>
    <polygon points="475,355 466,350 466,360"/>
    <polygon points="855,299 850,290 860,290"/>
    <polygon points="740,419 731,414 731,424"/>
  </g>
  <g fill="#EAF3FC" stroke="#111111" stroke-width="1.3">
    <rect x="30" y="115" width="124" height="66" rx="10"/>
    <rect x="195" y="103" width="168" height="90" rx="10"/>
    <rect x="407" y="58" width="250" height="185" rx="10"/>
    <rect x="705" y="87" width="265" height="112" rx="10"/>
    <rect x="250" y="321" width="170" height="68" rx="10"/>
    <rect x="740" y="299" width="230" height="60" rx="10"/>
    <rect x="740" y="386" width="230" height="65" rx="10"/>
  </g>
  <polygon points="570,300 665,355 570,410 475,355" fill="#FFF1BD" stroke="#111111" stroke-width="1.3"/>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#111111" text-anchor="middle">
    <text x="92" y="155" font-size="20">决定请求</text>
    <text x="279" y="142" font-size="20">版本与</text>
    <text x="279" y="170" font-size="20">幂等检查</text>
    <text x="532" y="88" font-size="22">D1 原子事务</text>
    <text x="837.5" y="119" font-size="22">统一快照</text>
    <text x="837.5" y="152" font-size="18">要点（bullet）</text>
    <text x="837.5" y="179" font-size="18">直接从账本读取</text>
    <text x="335" y="363" font-size="22">后台概要</text>
    <text x="570" y="349" font-size="18">输入版本</text>
    <text x="570" y="374" font-size="18">仍有效？</text>
    <text x="855" y="336" font-size="20">发布当前正文</text>
    <text x="855" y="412" font-size="20">保留历史</text>
    <text x="855" y="438" font-size="18">等待最新任务</text>
    <text x="704" y="267" font-size="18">是</text>
    <text x="724" y="380" font-size="18">否</text>
  </g>
  <g font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#111111" font-size="18">
    <text x="456" y="116">• 新版本</text>
    <text x="456" y="142">• 决定记录</text>
    <text x="456" y="168">• 依赖失效</text>
    <text x="456" y="194">• outbox</text>
    <text x="456" y="220">• 回执</text>
    <text x="349" y="269">事务 outbox</text>
  </g>
</svg>
